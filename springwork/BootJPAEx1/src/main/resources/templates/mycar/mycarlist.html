<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=East+Sea+Dokdo&family=Jua&family=Gaegu&family=Gamja+Flower&family=Pacifico&family=Single+Day&display=swap"
          rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <style>
        body * {
            font-family: 'Jua';
        }
        div.box{
            width: 30px;
            height: 30px;
            border: 1px solid black;
            border-radius: 100px;
        }

    </style>

</head>
<body>

<h3 class="alert alert-info alert-group" style="width: 800px;">
    총 [[${count}]]개의 자동차 목록이 있습니다
<button type="button" class="btn btn-sm btn-danger" style="float: right;" onclick="location.href='./form'">자동차등록</button>
</h3>
<table class="table table-bordered" style="width: 800px;">
    <tr align="center">
        <th width="50">번호</th>
        <th width="250">자동차명</th>
        <th width="100">가격</th>
        <th width="100">색상</th>
        <th width="150">구입일</th>
        <th>이미지</th>
    </tr>
    <!--반복문-->
    <tr th:each="car : ${cars}" align="center" style="line-height: 50px;">
        <td th:text="${car.num}"></td>
        <td th:text="${car.carname}"></td>
        <tdn                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             >
            <span th:text="${#numbers.formatInteger(car.carprice, 0, 'COMMA')}"></span>
        </tdn>
        <td>
            <div class="box" th:style="'background-color:' + ${car.carcolor}"></div>
        </td>
        <td th:text="${car.carguip}"></td>
        <td>
            <img th:src="'https://vdeghj5x3716.edge.naverncp.com/iI0wM9dyqa/mycar/' + ${car.carphoto} + '?type=f&w=40&h=40&ttype=jpg'" hspace="10" border="1"/>
        </td>
    </tr>
</table>
</body>
</html>
